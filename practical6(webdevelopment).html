<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: #f0f8ff;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Student Grade Calculator</h1>

        <label>Subject 1:</label>
        <input type="number" id="m1" min="0" max="100">

        <label>Subject 2:</label>
        <input type="number" id="m2" min="0" max="100">

        <label>Subject 3:</label>
        <input type="number" id="m3" min="0" max="100">

        <label>Subject 4:</label>
        <input type="number" id="m4" min="0" max="100">

        <label>Subject 5:</label>
        <input type="number" id="m5" min="0" max="100">

        <button onclick="calculateGrade()">Calculate Result</button>

        <div id="result">
            <p><strong>Total Marks:</strong> <span id="total"></span></p>
            <p><strong>Percentage:</strong> <span id="percentage"></span>%</p>
            <p><strong>Grade:</strong> <span id="grade"></span></p>
        </div>
    </div>

    <script>
        function calculateGrade() {

            let m1 = Number(document.getElementById("m1").value);
            let m2 = Number(document.getElementById("m2").value);
            let m3 = Number(document.getElementById("m3").value);
            let m4 = Number(document.getElementById("m4").value);
            let m5 = Number(document.getElementById("m5").value);

            let total = m1 + m2 + m3 + m4 + m5;
            let percentage = total / 5;
            let grade;

            if (percentage >= 90) {
                grade = "A+";
            } else if (percentage >= 80) {
                grade = "A";
            } else if (percentage >= 70) {
                grade = "B";
            } else if (percentage >= 60) {
                grade = "C";
            } else if (percentage >= 50) {
                grade = "D";
            } else {
                grade = "F";
            }

            document.getElementById("total").innerHTML = total + " / 500";
            document.getElementById("percentage").innerHTML = percentage.toFixed(2);
            document.getElementById("grade").innerHTML = grade;

            document.getElementById("result").style.display = "block";
        }
    </script>

</body>
</html>
