<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal To-Do List</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-5">

    <div class="bg-white w-full max-w-lg p-6 rounded-xl shadow-lg">

        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">
            Personal To-Do List
        </h1>

        <!-- Add Task -->
        <div class="flex gap-2 mb-6">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
                class="flex-1 border border-gray-300 rounded-lg px-4 py-2
                       focus:outline-none focus:ring-2 focus:ring-blue-500"
            >

            <button
                id="addBtn"
                class="bg-blue-600 text-white px-5 py-2 rounded-lg
                       hover:bg-blue-700">
                Add
            </button>
        </div>

        <!-- Task List -->
        <ul id="taskList" class="space-y-3"></ul>

    </div>

    <script>
        const taskInput = document.getElementById("taskInput");
        const addBtn = document.getElementById("addBtn");
        const taskList = document.getElementById("taskList");

        // Add Task
        addBtn.addEventListener("click", addTask);

        taskInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                addTask();
            }
        });

        function addTask() {

            const taskText = taskInput.value.trim();

            if (taskText === "") {
                alert("Please enter a task.");
                return;
            }

            // Create list item
            const li = document.createElement("li");

            li.className =
                "flex items-center justify-between bg-gray-50 " +
                "border border-gray-200 p-3 rounded-lg";

            // Task text
            const span = document.createElement("span");

            span.textContent = taskText;

            span.className =
                "text-gray-700 cursor-pointer flex-1";

            // Mark as completed
            span.addEventListener("click", function() {
                span.classList.toggle("line-through");
                span.classList.toggle("text-gray-400");
            });

            // Delete button
            const deleteBtn = document.createElement("button");

            deleteBtn.textContent = "Delete";

            deleteBtn.className =
                "bg-red-500 text-white px-3 py-1 rounded-md " +
                "hover:bg-red-600 ml-3";

            deleteBtn.addEventListener("click", function() {
                li.remove();
            });

            // Add elements
            li.appendChild(span);
            li.appendChild(deleteBtn);

            taskList.appendChild(li);

            // Clear input
            taskInput.value = "";
            taskInput.focus();
        }
    </script>

</body>
</html>
